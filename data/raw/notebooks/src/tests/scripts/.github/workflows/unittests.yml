name: Python CI

on:
  push:
    branches: [ task-1 ]
  pull_request:
    branches: [ task-1 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run basic import test
      run: |
        python -c "import pandas, numpy, matplotlib; print('Imports successful')"
